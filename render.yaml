databases:
  - name: marketplace-db
    databaseName: marketplace
    user: marketplace_user
    plan: free
    region: ohio

services:
  - type: web
    name: marketplace
    runtime: python
    plan: free
    region: ohio
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn market.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
