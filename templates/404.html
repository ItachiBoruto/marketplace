<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Mi Marketplace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-box {
            max-width: 500px;
            text-align: center;
            background: rgba(255,255,255,0.05);
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: #e94560;
            line-height: 1;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(233,69,96,0.4);
        }
        .error-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            font-weight: 700;
        }
        p {
            color: rgba(255,255,255,0.75);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        a {
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #e94560;
            color: white;
        }
        .btn-primary:hover { background: #c0392b; }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-icon">🔍</div>
        <div class="error-code">404</div>
        <h1>Página no encontrada</h1>
        <p>
            La página que buscas no existe, fue movida o el enlace
            está roto. Verifica la dirección o vuelve al inicio.
        </p>
        <div class="actions">
            <a href="/" class="btn-primary">🏠 Ir al inicio</a>
            <a href="/stores/" class="btn-secondary">📦 Ver comercios</a>
        </div>
    </div>
</body>
</html>
