{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisa tu correo</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .done-page { max-width: 420px; margin: 60px auto; padding: 20px; }
        .done-card {
            background: white; border-radius: 12px; padding: 32px 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center;
        }
        .done-icon { font-size: 3.5rem; margin-bottom: 10px; }
        .done-card h1 { font-size: 1.3rem; color: #1a1a2e; margin: 0 0 12px; }
        .done-card p { color: #555; font-size: 0.9rem; line-height: 1.6; margin: 0 0 12px; }
        .done-card a {
            display: inline-block; margin-top: 12px; padding: 10px 24px;
            background: #e94560; color: white; text-decoration: none;
            border-radius: 8px; font-weight: 600; font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="done-page">
        <div class="done-card">
            <div class="done-icon">📧</div>
            <h1>Revisa tu correo</h1>
            <p>
                Si existe una cuenta con ese correo, te enviamos un enlace para
                restablecer tu contraseña.
            </p>
            <p style="font-size:0.82rem;color:#95a5a6;">
                Revisa también la carpeta de spam. El enlace expira en 1 hora.
            </p>
            <a href="{% url 'login' %}">Volver al inicio de sesión</a>
        </div>
    </div>
</body>
</html>
