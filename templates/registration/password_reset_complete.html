{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña actualizada</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .complete-page { max-width: 420px; margin: 60px auto; padding: 20px; }
        .complete-card {
            background: white; border-radius: 12px; padding: 32px 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center;
        }
        .complete-icon { font-size: 3.5rem; margin-bottom: 10px; }
        .complete-card h1 { font-size: 1.3rem; color: #2ecc71; margin: 0 0 12px; }
        .complete-card p { color: #555; font-size: 0.9rem; line-height: 1.6; margin: 0 0 16px; }
        .complete-card a {
            display: inline-block; padding: 12px 28px; background: #e94560;
            color: white; text-decoration: none; border-radius: 8px;
            font-weight: 600; font-size: 0.95rem;
        }
        .complete-card a:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div class="complete-page">
        <div class="complete-card">
            <div class="complete-icon">✅</div>
            <h1>¡Contraseña actualizada!</h1>
            <p>Ya puedes iniciar sesión con tu nueva contraseña.</p>
            <a href="{% url 'login' %}">Ir al inicio de sesión</a>
        </div>
    </div>
</body>
</html>
