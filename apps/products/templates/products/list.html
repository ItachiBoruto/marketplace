<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Marketplace</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <div class="container">
            <h1>🛒 Mi Marketplace</h1>
            <nav>
                <a href="/">🏠 Inicio</a>
                <a href="/stores/">📦 Comercios</a>
                
                <!-- Admin solo para staff -->
                {% if user.is_authenticated and user.is_staff %}
                    <a href="/admin/">⚙️ Admin</a>
                {% endif %}
                
                <!-- Carrito para autenticados -->
                {% if user.is_authenticated %}
                    <a href="{% url 'cart:view' %}">🛒 Carrito</a>
                {% endif %}
                
                <!-- Usuario autenticado: nombre y logout -->
                {% if user.is_authenticated %}
                    <span style="color: rgba(255,255,255,0.7); margin: 0 10px;">👤 {{ user.username }}</span>
                    <form action="{% url 'logout' %}" method="post" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit" style="background: none; border: none; color: rgba(255,255,255,0.85); cursor: pointer; font-size: 0.95rem; padding: 0; margin: 0 10px;">🚪 Cerrar sesión</button>
                    </form>
                {% endif %}
            </nav>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar productos...">
                <button id="searchBtn">🔍</button>
            </div>
            <div class="filter">
                <select id="storeFilter">
                    <option value="">Todos los comercios</option>
                    {% for store in stores %}
                        <option value="{{ store.id }}">{{ store.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="filter">
                <select id="categoryFilter">
                    <option value="">Todas las categorías</option>
                    {% for category in categories %}
                        <option value="{{ category }}">{{ category }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="filter">
                <select id="sortFilter">
                    <option value="name">Orden alfabético</option>
                    <option value="price">Menor precio</option>
                    <option value="-price">Mayor precio</option>
                    <option value="-created_at">Más recientes</option>
                </select>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div id="productGrid" class="product-grid">
                <!-- Los productos se cargan vía JavaScript -->
            </div>
            <div id="loading" style="display: none; text-align: center; padding: 20px;">
                Cargando más productos...
            </div>
        </div>
    </main>

    <script>
        // ===== CONFIGURACIÓN =====
        const productGrid = document.getElementById('productGrid');
        const loading = document.getElementById('loading');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const storeFilter = document.getElementById('storeFilter');
        const categoryFilter = document.getElementById('categoryFilter');
        const sortFilter = document.getElementById('sortFilter');

        let currentPage = 1;
        let isLoading = false;
        let hasMore = true;
        let currentSearch = '';
        let currentStore = '';
        let currentCategory = '';
        let currentSort = 'name';

        // ===== CARGAR PRODUCTOS =====
        async function loadProducts(page = 1, search = '', store = '', category = '', sort = 'name') {
            if (isLoading || !hasMore) return;
            isLoading = true;
            loading.style.display = 'block';

            try {
                const url = `/api/products/?page=${page}&search=${encodeURIComponent(search)}&store=${store}&category=${encodeURIComponent(category)}&sort=${sort}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.results.length === 0 && page === 1) {
                    productGrid.innerHTML = '<p style="text-align:center; padding:40px;">No hay productos disponibles.</p>';
                    hasMore = false;
                    loading.style.display = 'none';
                    return;
                }

                if (data.results.length === 0) {
                    hasMore = false;
                    loading.textContent = '✅ Todos los productos cargados';
                    loading.style.display = 'block';
                    return;
                }

                if (page === 1) {
                    productGrid.innerHTML = '';
                }

                data.results.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.dataset.store = product.store_id;
                    card.onclick = function() {
                        window.location.href = `/product/${product.id}/`;
                    };
                    card.innerHTML = `
                        <div class="product-image">
                            ${product.image ? `<img src="${product.image}" alt="${product.name}">` : '<div class="no-image">Sin imagen</div>'}
                        </div>
                        <div class="product-info">
                            <h3 class="product-name">${product.name}</h3>
                            <p class="store-name">${product.store_name || 'Sin comercio'}</p>
                            <p class="price">$${product.price}</p>
                            <p class="stock-counter">📦 Stock: <span id="stock-${product.id}">${product.stock}</span></p>
                        </div>
                    `;
                    productGrid.appendChild(card);
                });

                currentPage = page;
                hasMore = data.next !== null;

                if (!hasMore) {
                    loading.textContent = '✅ Todos los productos cargados';
                    loading.style.display = 'block';
                } else {
                    loading.textContent = 'Cargando más productos...';
                    loading.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                loading.textContent = 'Error al cargar. Intenta de nuevo.';
            } finally {
                isLoading = false;
            }
        }

        // ===== SCROLL INFINITO =====
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && hasMore && !isLoading) {
                const nextPage = currentPage + 1;
                loadProducts(nextPage, currentSearch, currentStore, currentCategory, currentSort);
            }
        }, { threshold: 0.5 });

        observer.observe(loading);

        // ===== BÚSQUEDA Y FILTROS =====
        function performSearch() {
            productGrid.innerHTML = '';
            currentPage = 1;
            hasMore = true;
            currentSearch = searchInput.value.trim();
            currentStore = storeFilter.value;
            currentCategory = categoryFilter.value;
            currentSort = sortFilter.value;
            loading.textContent = 'Cargando más productos...';
            loading.style.display = 'block';
            loadProducts(1, currentSearch, currentStore, currentCategory, currentSort);
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
        storeFilter.addEventListener('change', performSearch);
        categoryFilter.addEventListener('change', performSearch);
        sortFilter.addEventListener('change', performSearch);

        // ===== CARGA INICIAL =====
        loadProducts(1, '', '', '', 'name');
    </script>
</body>
</html>
