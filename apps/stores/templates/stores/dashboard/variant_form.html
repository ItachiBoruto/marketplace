{% extends 'stores/dashboard/base.html' %}

{% block title %}{% if form.instance.pk %}Editar{% else %}Crear{% endif %} producto{% endblock %}

{% block content %}
<h1>{% if form.instance.pk %}Editar{% else %}Crear{% endif %} producto</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'stores:variant_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
