{% extends 'stores/dashboard/base.html' %}

{% block title %}{% if form.instance.pk %}Editar{% else %}Crear{% endif %} producto{% endblock %}

{% block content %}
<h1>{% if form.instance.pk %}Editar{% else %}Crear{% endif %} producto</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="background: #3498db; color: white; border: none; padding: 10px 25px; border-radius: 25px;">Guardar</button>
    <a href="{% url 'stores:product_list' store.id %}">Cancelar</a>
</form>
{% endblock %}
