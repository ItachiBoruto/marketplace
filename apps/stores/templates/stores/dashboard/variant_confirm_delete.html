{% extends 'stores/dashboard/base.html' %}

{% block title %}Eliminar producto{% endblock %}

{% block content %}
<h1>¿Estás seguro de eliminar "{{ object.name }}"?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'stores:variant_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
